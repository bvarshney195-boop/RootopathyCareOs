spring:
  config:
    activate:
      on-profile: render
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}
  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${POSTGRES_DB}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    placeholders:
      applicationRole: ${DB_APP_ROLE:${DB_APP_USERNAME}}
      foundationSyntheticDataEnabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: false
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          ssl:
            checkserveridentity: true
          starttls:
            enable: true
            required: true
          timeout: 10000
          writetimeout: 10000
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
careos:
  security:
    allowed-origins: ${CAREOS_ALLOWED_ORIGINS}
    application-base-url: ${CAREOS_BASE_URL}
    mail-from: ${CAREOS_SECURITY_MAIL_FROM}
    token-pepper: ${CAREOS_TOKEN_PEPPER}
    mfa-encryption-key: ${CAREOS_MFA_ENCRYPTION_KEY}
